[package]
name = "aso"
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "One command line and one config to install, run, check and upgrade an AIR service: fsp-mint, air_server behind nginx, and the service's ecash-wallet."

[dependencies]
air-minterface = { git = "https://github.com/dav-anderson/air-minterface.git", tag = "v0.3.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Local time for `aso upgrade --at` and its printed time zone (EDT, CET): the
# system zone, and a bundled zone database so a machine without one still works.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }

[lib]
name = "aso"
path = "src/lib.rs"

[[bin]]
name = "aso"
path = "src/main.rs"
